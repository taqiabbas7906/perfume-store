name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time stubs; real values injected at deploy time.
          MONGODB_URI: mongodb://stub
          FIREBASE_PROJECT_ID: stub
          FIREBASE_CLIENT_EMAIL: stub@stub.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: stub
          NEXT_PUBLIC_FIREBASE_API_KEY: stub
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: stub
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: stub
